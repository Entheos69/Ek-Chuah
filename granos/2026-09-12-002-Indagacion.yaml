    premisa: 'El Guardian declaro (S219, 2026-09-12) que una reaccion lleva aceleradores,
      catalizadores, aditivos, modificadores de superficie, antiflama, protectores
      UV, pigmentos, etc., que no todos funcionan en todos lados y que elegir el adecuado
      para una reaccion en particular tambien es optimizar; pidio formalizar la terminologia
      porque no tiene el bagaje. Hace falta la nomenclatura formal de la industria
      de aditivos para polimeros y roca de que la eleccion depende del sistema.

      '
    busqueda:
    - aditivos para polimeros clasificacion aceleradores catalizadores retardantes
      de llama estabilizadores UV HALS pigmentos agentes de acoplamiento modificadores
      de superficie
