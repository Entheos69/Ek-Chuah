    conclusion: 'Verificado por fetch directo: la sosa caustica es limpiador de grasa
      de uso corriente (saponifica), ataca el aluminio liberando hidrogeno y calor,
      quema la piel sin dolor inmediato y su disolucion en agua es fuertemente exotermica.
      Eso sostiene el parrafo nuevo de Limpiadores §2. Lo que NO tiene roca (dos fuentes
      del resumen del buscador devolvieron HTTP 403 al fetch: amoquimicos.com, y no
      se inscribe): "ataca zinc y varios plasticos" -- se retiro del copy.

      '
    inferidor:
      model: code/claude-fable-5-1
      ts: '2026-09-12T13:24:00-06:00'
  - local_id: i2
    premisa: 'El Guardian pidio anadir "lavado en seco en industria alimenticia y
      medicinas" a la lista de trabajos donde el catalogo de limpiadores rinde (proceso
      normalizado y verificable). Hace falta roca de que la limpieza en seco es practica
      de la industria de alimentos y por que se prefiere al agua.

      '
    busqueda:
    - limpieza en seco industria alimentaria farmaceutica dry cleaning higiene sin
      agua validacion limpieza
    resultados_crudos:
    - fuente: pmc.ncbi.nlm.nih.gov/articles/PMC13188896/
      texto: Food soils that are moistened but not removed by wet cleaning enhance
        food safety risk as they both shield pathogens from chemical sanitizers and
        are a nutrient-rich, high-moisture matrix conducive to microbial growth
    - fuente: pmc.ncbi.nlm.nih.gov/articles/PMC13188896/
      texto: the FDA recommends that water use during sanitation should be minimized
        and that surfaces should be dried promptly to prevent microbial growth
    - fuente: pmc.ncbi.nlm.nih.gov/articles/PMC13188896/
      texto: One of the few instances in which water is intentionally introduced into
        LMF facilities is during wet sanitation conducted to mitigate allergen cross-contact
        and the cross-contamination risks
    conclusion: 'Re-emision 2026-09-12: la roca original (ecolab.com) quedo inalcanzable
      desde el sandbox (403 WAF); sustituida por una roca viva equivalente y canonica:
      articulo revisado por pares (Applied and Environmental Microbiology, via PMC/NCBI).
      Verificado por fetch directo: en instalaciones de alimentos de baja humedad
      (LMF) el agua que introduce la sanitizacion humeda crea una matriz propicia
      al crecimiento microbiano; la FDA recomienda minimizar el agua y secar pronto
      (de ahi la limpieza en seco); el agua solo se introduce a proposito para mitigar
      el contacto cruzado de alergenos. Alimentos SI; farmaceutica NO esta en esta
      roca (testimonio del Guardian).

      '
    inferidor:
      model: code/claude-fable-5-1
      ts: '2026-09-12T13:24:00-06:00'
