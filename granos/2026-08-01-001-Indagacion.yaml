ek_chuah_aec:
  meta:
    schema_version: aec-1
    session_id: 2026-08-01-001-Indagacion
    consolidado_por: Guardian
    project: ek-chuah
  inscripciones:
  - local_id: i1
    premisa: 'El Guardian reclasifica el dioxido de titanio como pigmento y pide adjudicar
      por indagacion web la carga funcional mas usada o recomendada para adhesivos
      epoxicos de dos componentes, como base de una serie de pruebas condicionada
      a compra dentro del set de materializacion v2 de INDUPOX.

      '
    busqueda:
    - most common fillers two component epoxy adhesive formulation calcium carbonate
      talc silica
    resultados_crudos:
    - fuente: uspto.gov / patente US 9,856,374
      texto: Preferred filler materials are calcium carbonates, calcined kaolins,
        carbon black
    - fuente: uspto.gov / patente US 7,084,210
      texto: More preferred inorganic fillers include calcium carbonate
    - fuente: chemicalformulaservices.com
      texto: fillers include silica, calcium carbonate, talc, or glass fibers
    conclusion: 'Convergencia sin ambiguedad entre patentes de formulacion y guias
      del ramo: el carbonato de calcio es la carga preferida y mas citada para epoxicos
      2K (rango tipico 10-70 % en peso, preferencia 20-60); talco segundo consistente;
      la silice pirogenica es reologico (papel ya cubierto por la arcilla organica
      de la linea) y las microesferas de vidrio carga ligera de nicho. Lectura fechada,
      re-derivable de los extractos. La re-derivacion de la pasta de paridad (45.3/54.7,
      r=1.00) es aritmetica interna del set v2, no de estas fuentes.

      '
    inferidor:
      model: estratega/claude-fable-5
      ts: '2026-08-01T10:02:00'
  - local_id: i2
    premisa: 'El set v2 abre la matriz de adhesion a acero, aluminio, plastico reforzado
      con fibra de vidrio y plastico termoformado; falta la base documental de que
      termoplasticos admiten union epoxica, con que preparacion, y cuales deben declararse
      fuera de promesa estructural.

      '
    busqueda:
    - epoxy adhesive bonding polypropylene ABS plastic surface preparation flame treatment
      adhesion
    resultados_crudos:
    - fuente: kohesibond.com
      texto: ABS, polycarbonate, and PVC can usually bond well with epoxy
    - fuente: support.systemthree.com
      texto: Epoxies in general will not form a strong bond to thermoplastics
    - fuente: epoxyworks.com
      texto: Plastics such as ABS greatly benefit from flame treating
    - fuente: permabond.com
      texto: low surface energy or poor wettability - typically only 29mN/m
    conclusion: 'La evidencia divide tajante por energia superficial: ABS, policarbonato
      y PVC adhieren bien con lija y limpieza (flameado mejora, en especial ABS);
      las poliolefinas (PP/PE, ~29 mN/m contra >36 requeridos) no sostienen union
      estructural confiable sin tratamiento, y aun flameadas la promesa es limitada.
      Esto ordena en el set v2: identificacion previa del termoformado por densidad,
      flameado protocolizado (~1 s de exposicion acumulada, verificacion por mojado
      de gota), y celdas de poliolefina y acrilico declaradas informativas, sin criterio
      de pase.

      '
    inferidor:
      model: estratega/claude-fable-5
      ts: '2026-08-01T10:08:00'
  - local_id: i3
    premisa: 'El Guardian pide considerar refuerzos estructurales (mallas plasticas
      o de acero) para las variantes del set v2, con lo que recomiende la practica
      documentada del ramo automotriz.

      '
    busqueda:
    - reinforcing mesh epoxy repair fiberglass stainless steel mesh bumper plastic
      repair reinforcement
    resultados_crudos:
    - fuente: polyvance.com
      texto: like putting rebar into concrete... it makes the repair much stronger
    - fuente: autobodytoolmart.com / Lord Fusor 700
      texto: best used for backing patches, bumper tabs and other reinforcements
    - fuente: engineerfix.com
      texto: a reinforcing fiberglass or plastic mesh is embedded into the wet epoxy
    conclusion: 'La malla embebida en el adhesivo es practica estandar del ramo de
      reparacion automotriza de plasticos: capa de adhesivo, malla hundida en fresco,
      capa que la cubre — refuerzo tipo varilla-en-concreto, ofrecido comercialmente
      como respaldo de parches para adhesivos de dos componentes. Candidatas de ferreteria:
      malla de fibra de vidrio (cinta de tablaroca) y malla metalica de mosquitero.
      En el set v2 se materializa como puentes de junta a tope con tres condiciones
      (corridas 45-47), condicionadas al insumo menor.

      '
    inferidor:
      model: estratega/claude-fable-5
      ts: '2026-08-01T10:14:00'
  necesidad:
    pregunta: 'Que carga funcional, que preparacion por sustrato y que refuerzo estructural
      recomienda la practica documentada del ramo, para iterar el set de pruebas de
      materializacion de INDUPOX a su version dos con base exogena y no con supuesto.

      '
    gatillo: explicito:'podemos dejarlo como pigmento y pensar en una carga opcional
      (aun no comprada) que surja de una corrida por la WEB como la mas usada o recomendada...
      necesitamos correr pruebas en acero, aluminio, plastico reforzado con fibra
      de vidrio, plastico termoformado... y considerar refuerzos estructurales, como
      mallas plasticas o de acero y lo que recomiende la investigacion correspondiente'
    origen_nodo: null
