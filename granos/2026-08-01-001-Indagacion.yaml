  - txt: 'Decision del set v2: el dioxido de titanio queda reclasificado como pigmento
      y el carbonato de calcio natural molido se adopta como carga funcional candidata
      de la serie condicionada a compra (corridas 48-56).

      '
    tipo: decision
    estatus: afirmado
    survived_from: r2
    inferida_por: i1
  - txt: 'ABS, policarbonato y PVC admiten union epoxica con preparacion simple; los
      epoxicos no forman union estructural confiable sobre termoplasticos de baja
      energia (poliolefinas ~29 mN/m) sin tratamiento superficial.

      '
    tipo: claim
    estatus: afirmado
    survived_from: r4
    inferida_por: i2
  - txt: 'El flameado con soplete (exposicion acumulada de ~1 s, sin decolorar) eleva
      la energia superficial y mejora la adhesion epoxica sobre termoplasticos, en
      especial ABS; verificacion practica por extension de gota de agua.

      '
    tipo: claim
    estatus: afirmado
    survived_from: r6
    inferida_por: i2
  - txt: 'Decision del set v2: la matriz de adhesion declara informativas, sin criterio
