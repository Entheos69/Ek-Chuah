  afirmaciones:
  - txt: 'El carbonato de calcio es la carga funcional preferida y mas citada para
      adhesivos epoxicos de dos componentes; rango tipico 10-70 % en peso con preferencia
      20-60; talco segundo consistente.

      '
    tipo: claim
