  inscripciones:
  - local_id: i1
    premisa: 'Hueco: mas alla de delimitadores en el prompt, cual es la frontera de
      defensa anti-inyeccion (directa e indirecta) para agentes con herramientas tipo
      Alex/Nora. Encuadre disparado por H9 de la auditoria S205 y por el frente F4
      (sistema inmune v2).

      '
    busqueda:
    - CaMeL FIDES Progent prompt injection defense capabilities information flow control
      2026
    - indirect prompt injection defense spotlighting delimiters best practices 2026
    resultados_crudos:
    - fuente: howardism.dev (Out-of-Band Prompt-Injection Defense, 2026-07-15)
      texto: prompt injection is an authorization problem, not a content problem
    - fuente: arXiv:2503.18813 (CaMeL, Debenedetti et al.)
      texto: solving 77% of tasks with provable security
    - fuente: arXiv:2606.26479 (LaunchSafe, out-of-band defenses survey)
      texto: enforce security outside the model with a deterministic policy
    conclusion: 'La primera generacion de defensas (clasificadores, guardarrailes,
      fine-tuning adversarial) trato la inyeccion como problema de CONTENIDO y cae
      ante ataques adaptativos. La segunda generacion (CaMeL, FIDES, Progent, RTBAS,
      FORGE) la reencuadra como problema de AUTORIZACION y aplica la seguridad FUERA
      del modelo via monitor de referencia determinista, con principios clasicos (Biba,
      minimo privilegio, Saltzer-Schroeder). No es bala de plata: se valida en benchmarks
      estaticos y una reproduccion adaptativa independiente dejo ~2.6% de ASR residual.
      Los delimitadores/datamarking son refuerzo probabilistico, no la defensa.

      '
    inferidor:
      model: fable/claude-opus-4-8
      ts: '2026-08-31T13:12:15'
  - local_id: i2
    premisa: 'Hueco: el ecosistema MCP (superficie exogena que INDUCOP tambien opera)
      tiene clases de vulnerabilidad y CVEs nombrados confirmados, distinguibles de
      las cifras contestadas.

      '
    busqueda:
    - MCP server security vulnerabilities GitHub repos SSRF tool poisoning 2026 unverified
      claims
    resultados_crudos:
    - fuente: seclists.org Full Disclosure (2026-May-22)
      texto: SSRF in Anthropic mcp-server-fetch and Microsoft playwright-mcp
    - fuente: 'agent-wars.com (MCP Security 2026: 30 CVEs in 60 Days)'
      texto: CVE-2025-6514 (mcp-remote, CVSS 9.6) affected 437,000+ downloads
    - fuente: blog.cyberdesserts.com (AI Agent Security Risks 2026)
      texto: CVE-2025-68143, CVE-2025-68144, CVE-2025-68145
    conclusion: 'Nivel confirmado y nombrado (durable): CVE-2025-6514 (mcp-remote,
      CVSS 9.6, 437k+ descargas); CVE-2025-68143/68144/68145 (Git MCP de Anthropic,
      acceso a archivos + RCE via inyeccion); SSRF en mcp-server-fetch de Anthropic
      y playwright-mcp de Microsoft (disclosure publico). Clases de ataque catalogadas:
      tool poisoning (instruccion maliciosa en la descripcion de la herramienta),
      SSRF, path traversal, rug pulls, cross-server. Las cifras porcentuales de prevalencia
      (SSRF 36.7% vs 30%; path traversal 82%) quedan FUERA de este grano: son contestadas
      y una auditoria reporto ~78% de falsos positivos en escaneres YARA -> NO durable.

      '
    inferidor:
      model: fable/claude-opus-4-8
      ts: '2026-08-31T13:12:15'
