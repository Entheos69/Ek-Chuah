  inscripciones:
  - local_id: i1
    premisa: 'Para redisenar la vista publica de INDUCOP de un catalogo de productos
      a 6 areas de negocio heterogeneas (producto + servicios + financiera) hace falta
      el patron de estructura de sitio que el mercado usa para grupos con oferta compleja/multiples
      lineas.

      '
    busqueda:
    - B2B website navigation structure multiple divisions hub-and-spoke customer intent
    resultados_crudos:
    - fuente: trajectorywebdesign.com/blog/b2b-website-navigation
      texto: The hub-and-spoke model creates a central landing page for each major
        topic, with related pages branching off from that hub.
    - fuente: trajectorywebdesign.com/blog/b2b-website-navigation
      texto: One of the most damaging navigation mistakes is organizing your site
        based on how your company is structured rather than how customers think.
    - fuente: trajectorywebdesign.com/blog/b2b-website-navigation
      texto: 'Industry-based navigation excels when your offerings vary significantly
        by sector. [hibrido: main navigation solution-based + secondary ''Industries''
        menu]'
    - fuente: trajectorywebdesign.com/blog/b2b-website-navigation
      texto: Progressive disclosure helps manage complexity on small screens. Start
        with main categories, then reveal subcategories as needed.
    conclusion: 'El patron canonico para sitios B2B con multiples lineas es hub-and-spoke
      (landing central por tema + paginas que ramifican), organizado por intencion
      del cliente (no por el organigrama interno), con navegacion por industria cuando
      la oferta varia por sector y progressive disclosure en movil. Lectura verificada
      por fetch directo de la pagina.

      '
    inferidor:
      model: code/claude-opus-4-8
      ts: '2026-09-06T13:41:00-06:00'
  - local_id: i2
    premisa: '4 de las 6 areas de INDUCOP no son un catalogo de productos (Financiera,
      Automotriz, Diseno de software, y parte de Quimica), y el cliente ya tiene una
      veta multi-marca (django-tenants, 3 dominios). Se necesita el patron para grupos
      multi-marca/conglomerado.

      '
    busqueda:
    - corporate website design multiple business units holding multi-brand design
      system
    resultados_crudos:
    - fuente: uxpin.com/studio/blog/corporate-website-design-examples
      texto: The Volkswagen Group presents multiple brands (Porsche, Audi, Lamborghini)
        under a unified corporate umbrella. The site uses a consistent design language
        while allowing each brand's personality to shine through.
    - fuente: uxpin.com/studio/blog/corporate-website-design-examples
      texto: multi-brand companies need a corporate design system flexible enough
        to accommodate brand variations while maintaining structural consistency.
    - fuente: uxpin.com/studio/blog/corporate-website-design-examples
      texto: IBM's Carbon Design System ensures every page follows consistent patterns
        [backbone of consistent corporate web design at scale].
    - fuente: uxpin.com/studio/blog/corporate-website-design-examples
      texto: Microsoft's site manages extraordinary content complexity with a clear
        mega-menu navigation system and audience-segmented pathways.
    - fuente: uxpin.com/studio/blog/corporate-website-design-examples
      texto: corporate sites should lead with the corporate narrative (mission, values,
        impact), with clear paths to subsidiary and product content.
    conclusion: 'Para grupos multi-marca/conglomerado la practica es: liderar con
      narrativa corporativa y dar rutas claras a subsidiarias/productos; audiencia-segmentada
      via mega-menu; y un design system que acomode variacion de marca manteniendo
      consistencia estructural (una estructura, N pieles). Esto legitima Opcion C
      de INDUCOP (hub interno namespaced, migrable a multi-marca).

      '
    inferidor:
      model: code/claude-opus-4-8
      ts: '2026-09-06T13:41:00-06:00'
