  inscripciones:
  - local_id: i1
    premisa: 'El proyecto modulo_puerta (Taller) viro a un modulo sustituto con MCU.
      Falta elegir el driver del puente H del motor elevavidrios (estado solido con
      sensado de corriente) y decidir si el puente del seguro sigue con relevador
      o pasa a estado solido. El Guardian establecio que la cabina es de 12 V; la
      corriente del motor no esta medida, por lo que se buscan candidatos en dos escalones
      de corriente. La premisa comercial a contrastar es que el relevador en lote
      chico es dificil y caro.

      '
    busqueda:
    - automotive integrated full H-bridge motor driver current sense window lift 30A
      VNH7040 VNH7070 datasheet
    - TI DRV8245-Q1 DRV8243-Q1 automotive H-bridge driver integrated current sense
      window lift datasheet
    - Infineon BTN9970LV BTN9990LV half-bridge NovalithIC+ current sense window lift
      datasheet
    - NXP MC33HB2002 H-bridge 10 A automotive current feedback door lock datasheet
    - DRV8245SQPWPRQ1 price stock Digi-Key Mouser
    - VNH7040AYTR price stock Mouser Digi-Key
    - KEMET EX2-2U1S twin relay automotive 12V coil datasheet contact rating price
    - VNH7070ASTR Digi-Key price in stock
    - DRV8243HQDGQRQ1 Digi-Key price in stock
    resultados_crudos:
    - fuente: st.com (ficha VNH7040AY)
      texto: 'Output current: 35 A'
    - fuente: st.com (hoja de datos VNH7070AS, DocID028088 Rev 5)
      texto: PWM operation up to 20 kHz
    - fuente: ti.com (hoja de datos DRV8245-Q1, SLVSFJ1E)
      texto: 4.5V to 35V (40V abs. max) operating range
    - fuente: ti.com (ficha DRV8243-Q1)
      texto: Integrated current sense (eliminates shunt resistor)
    - fuente: infineon.com (ficha BTN9970LV)
      texto: Supply Voltage range 8 V to 18 V
    - fuente: digikey.co.uk (EX2-2U1S)
      texto: Automotive Relay SPDT (1 Form C) x 2 12VDC Coil Through Hole
    - fuente: digikey.com (DRV8245SQPWPRQ1)
      texto: Bipolar, Unipolar Motor Driver Power MOSFET PWM, SPI 28-HTSSOP
    - fuente: digikey.com (VNH7040AYTR)
      texto: Motor Driver Power MOSFET PWM PowerSSO-36 TP
    - fuente: digikey.com (VNH7070ASTR)
      texto: Motor Driver Power MOSFET PWM 16-SO
    conclusion: 'Lectura del 2026-11-15, no hecho. (1) Para cabina de 12 V hay tres
      familias vigentes de puente H con sensado de corriente integrado: ST VNH7 (VNH7040AY
      35 A, VNH7070AS 15 A, 4-28 V de operacion, 38 V maximo), TI DRV824x-Q1 (DRV8245
      32 A, DRV8243 12 A, 4.5-35 V, 40 V maximo, con modelo PSpice) e Infineon BTN99x0LV
      (medio puente, se usan dos, 8-18 V). Ninguna cubre un sistema de 24 V con su
      load dump. (2) El relevador doble EX2-2U1S del modulo original tiene bobina
      de 12 VCD y contactos de 30 A: es evidencia de que el modulo opera a 12 V y
      da la cota de corriente que el original soportaba. (3) La premisa comercial
      se invierte en el dia de la captura: el relevador se vende por unidad (~2.8
      GBP) con miles en existencia, mientras los TI estaban agotados con 26 semanas
      de plazo y los ST, aunque con existencia, declaran 99 semanas de plazo de fabrica.
      Precios, existencias y plazos son volatiles (re-verificar pasados 45 dias).
      La pagina de Infineon se alcanzo por un enlace de redireccion, con riesgo de
      link-rot. No se obtuvo el numero de revision de la hoja de datos del VNH7040AY
      (st.com no permitio bajar el PDF) ni la hoja del MC33HB2002 de NXP, que queda
      sin caracterizar.

      '
    inferidor:
      model: estratega/claude-fable-5-2
      ts: '2026-11-15T16:17:26'
  necesidad:
    pregunta: 'Que circuitos integrados de puente H con sensado de corriente, vigentes
      y de grado automotriz, sirven para el motor elevavidrios de un modulo de puerta
      de 12 V, y como se compara en disponibilidad y costo un relevador automotriz
      doble por unidad frente a resolver tambien el seguro con estado solido.

      '
    gatillo: 'explicito:''procede'' (Guardian, 2026-11-15, sobre la SOL de CodeTaller
      ''Terna de drivers para el puente H del motor elevavidrios'' con el alcance
      propuesto por el Estratega: terna de 12 V en dos escalones, comparativo del
      seguro, grano al cierre)'
