  afirmaciones:
  - txt: El VNH7040AY (ST) es un puente H completo activo, de 35 A de salida, con
      realimentacion analogica de corriente del motor por el pin Multisense, en encapsulado
      PowerSSO-36.
    tipo: claim
    estatus: afirmado
    survived_from: r1
    inferida_por: i1
  - txt: El VNH7070AS (ST, DocID028088 Rev 5, mayo 2016) opera de 4 a 28 V con 38
      V maximo absoluto, 15 A de salida, limitacion de corriente de 15 A minimo, PWM
      hasta 20 kHz y encapsulado SO-16.
    tipo: claim
    estatus: afirmado
    survived_from: r2
    inferida_por: i1
  - txt: El DRV8245-Q1 (TI, SLVSFJ1E, revisada junio 2026) opera de 4.5 a 35 V con
      40 V maximo absoluto, proteccion de sobrecorriente desde 32 A, salida proporcional
      de corriente en IPROPI, entradas logicas de 3.3 y 5 V, y lista modulos de puerta
      entre sus aplicaciones.
    tipo: claim
    estatus: afirmado
    survived_from: r3
    inferida_por: i1
  - txt: 'El DRV8243-Q1 (TI) es el escalon menor de la misma familia: 12 A de salida
      maxima, mismo rango de 4.5 a 35 V, sensado de corriente integrado y modelos
      PSpice sin cifrar.'
    tipo: claim
    estatus: afirmado
    survived_from: r4
    inferida_por: i1
  - txt: El BTN9970LV (Infineon) es medio puente, activo y preferido, con rango de
      alimentacion de 8 a 18 V, 40 V maximo absoluto y deteccion de sobrecorriente
      desde 60 A; un puente H requiere dos piezas.
    tipo: claim
    estatus: afirmado
    survived_from: r5
    inferida_por: i1
  - txt: El relevador EX2-2U1S (KEMET) es un doble SPDT automotriz con bobina de 12
      VCD y contactos de 30 A; el 2026-11-15 estaba activo, a 2.79 GBP por unidad
      y con 15,880 piezas en existencia en Digi-Key.
    tipo: claim
    estatus: afirmado
    survived_from: r6
    inferida_por: i1
  - txt: El 2026-11-15 el DRV8245SQPWPRQ1 costaba 7.84 USD por unidad (5.13 a 100
      piezas) en Digi-Key, con cero existencia, 26 semanas de plazo de fabrica y reposicion
      esperada el 2026-12-23.
    tipo: claim
    estatus: afirmado
    survived_from: r7
    inferida_por: i1
  - txt: El 2026-11-15 el VNH7040AYTR costaba 5.81 USD por unidad (3.73 a 100 piezas)
