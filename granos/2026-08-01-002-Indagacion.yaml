  inscripciones:
  - local_id: i1
    premisa: 'El reporte de posicionamiento INDUPOX requiere un mapa del parque automotriz
      reparable: que familias de plastico existen, que ruta de reparacion admite cada
      una (soldadura, quimica, adhesion 2K) y cual es el eje que decide la ruta. El
      documento del Guardian cubre poliolefinas/flameado, ABS y PVC rigido; falta
      el cuadro completo y la posicion del epoxico frente a PU y soldadura.

      '
    busqueda:
    - plásticos industria automotriz tipos PP ABS PA policarbonato composites
    - reparación plásticos automotrices soldadura termoplástica vs adhesivo epóxico
      poliuretano promotor adherencia
    resultados_crudos:
    - fuente: next.henkel-adhesives.com (Teroson)
      texto: Los termoplásticos rígidos se pueden reparar también con adhesivos bicomponentes
        y soldadura
    - fuente: elchapista.com (tabla de plasticos del automovil)
      texto: Excelente adherencia en cualquier plástico, excepto los olefínicos
    conclusion: 'Dos ejes gobiernan la ruta de reparacion: polaridad superficial y
      arquitectura termica (termoplastico/termoestable). Los polares rigidos (ABS,
      PC, PA, PVC-R) aceptan adhesion epoxica directa sin promotor; las poliolefinas
      (PP/TPO) quedan fuera del alcance directo del epoxico salvo flameado + promotor.
      El PU domina termoplasticos flexibles; el epoxico domina rigidos y reforzados.
      Lectura fechada, re-derivable de los insumos.

      '
    inferidor:
      model: estratega/claude-fable-5
      ts: '2026-08-01T21:05:00'
  - local_id: i2
    premisa: 'Dentro del mapa, identificar el territorio donde el adhesivo epoxico
      bicomponente no compite contra la soldadura sino que es la unica via: los plasticos
      reforzados termoestables (SMC/FRP/GFRP/CFRP), y la practica de referencia comercial
      (3M) que define el espacio de producto para las variantes INDUPOX ya disenadas.

      '
    busqueda:
    - SMC fiberglass automotive body panel repair epoxy adhesive bonding
    - composites automotriz CFRP GFRP reparación adhesivo estructural epóxico fibra
      carbono
    resultados_crudos:
    - fuente: industrial.sherwin-williams.com (ficha 3M SMC/Fiberglass Repair Adhesive)
      texto: two-part urethanes or two-part epoxies used to bond backup strips to
        SMC
    - fuente: vizonfiber.com (fibra de carbono automotriz)
      texto: El CFRP no puede soldarse
    conclusion: 'En SMC/FRP el adhesivo estructural 2K es la categoria de reparacion,
      no un competidor de la soldadura: tiras de respaldo por cara posterior, relleno
      lijable y pegado de paneles mapean uno a uno con las variantes INDUPOX V3/V2/V1.
      CFRP es horizonte (adhesion como unica via de union pero con curado y certificacion
      estrictos; la industria hoy sustituye mas que repara). Nota de locator: la URL
      canonica 3m.com resulto inalcanzable desde el actor local (timeout en prevuelo
      del grano 2026-08-01-001-Indagacion, nunca ingerido); se sustituyo por la ficha
      del mismo producto en el distribuidor oficial Sherwin-Williams, que reproduce
      verbatim la frase load-bearing citada. Riesgo de link-rot aceptado y documentado.
      Lectura fechada, re-derivable de los insumos.

      '
    inferidor:
      model: estratega/claude-fable-5
      ts: '2026-08-01T21:06:00'
