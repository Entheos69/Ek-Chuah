  inscripciones:
  - local_id: i1
    premisa: 'Los agentes del ecosistema (Estratega, Bibliotecario, CodeCS, etc.)
      carecen de referencia espacio-temporal: no saben en que dia u hora operan, no
      lo registran en sus artefactos, y confabulan deltas entre sesiones (asumen "sesion
      anterior = dia anterior"). El caso Alex topologico mostro que inyectar contexto
      temporal habilita una clase entera de inferencias situacionales. Se busca fundamento
      en la literatura reciente (papers 2025-2026), en teoria de marcos de referencia
      y en la tradicion de relojes logicos de sistemas distribuidos, para disenar
      una dimension espacio-temporal transversal a todos los agentes.

      '
    busqueda:
    - temporal grounding large language models paper 2025 2026
    - LLM agents temporal awareness current date confabulation situational awareness
      paper
    - time-aware memory multi-session dialogue LLM agent timestamp episodic memory
      2025
    - logical clocks Lamport vector clocks multi-agent LLM systems event ordering
    - Zep Graphiti bi-temporal knowledge graph agent memory valid_at invalid_at
    resultados_crudos:
    - fuente: arxiv.org/abs/2510.23853 (Your LLM Agents are Temporally Blind)
      texto: misalignment issues arising from agents' temporal blindness
    - fuente: 'arxiv.org/pdf/2505.20243 (It''s High Time: A Survey of Temporal Information
        Retrieval and Question Answering, seccion F.2)'
      texto: agents treat dialogue turns largely independently, causing temporal anchors
        to drift
    - fuente: arxiv.org/abs/2510.16685 (Structured yet Bounded Temporal Understanding)
      texto: contrasting deictic framing (past-present-future) and sequential framing
        (before-after)
    - fuente: 'arxiv.org/abs/2501.13956 (Zep: Temporal Knowledge Graph for Agent Memory)'
      texto: maintaining a timeline of facts and relationships, including their periods
        of validity
    - fuente: aeron.io/docs/distributed-systems-basics/logical-clocks (sobre Lamport
        1978)
      texto: time is less important than agreement across components of the order
    - fuente: snormore.dev/blog/logical-clocks-in-distributed-systems (Hybrid Logical
        Clocks)
      texto: a physical timestamp (wall-clock time) and a logical counter
    conclusion: 'La ceguera temporal de agentes LLM es un fenomeno nombrado y estudiado
      (2025-2026), con mecanismo identificado: deriva de anclas temporales por tratamiento
      independiente de turnos/sesiones. La receta minima de la literatura coincide
      con el diseno E1-E4 propuesto y agrega un quinto componente (verificacion de
      consistencia post-generacion). La teoria de marcos temporales de referencia
      (t-FoR) distingue marco deictico (requiere "ahora" anclado) de secuencial (requiere
      solo orden relativo); nuestros agentes operan hoy en secuencial degradado y
      confabulan al exigirseles deictico. La tradicion de relojes logicos (Lamport
      1978 -> vector clocks -> HLC) aporta el principio de que el orden causal acordado
      importa mas que el tiempo fisico, y el HLC (timestamp fisico + contador logico)
      es el estandar pragmatico aplicable al cabezal de sesion. El modelo bi-temporal
      de Zep/Graphiti (t_valid/t_invalid mundo + t_created/t_expired transaccional)
      es el estado del arte en persistencia de memoria de agentes y formaliza nuestra
      regla epistemologica 4 (liveness != veracidad). Lectura fechada y re-derivable
      de los insumos; las URLs arXiv son estables, las dos fuentes de relojes logicos
      son paginas de divulgacion tecnica con riesgo moderado de link-rot (aceptado,
      el concepto ancla es Lamport doi 10.1145/359545.359563).

      '
    inferidor:
      model: estratega/claude-fable-5
      ts: '2026-07-18T18:11:40'
