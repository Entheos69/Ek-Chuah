  afirmaciones:
  - txt: 'La desorientacion temporal de agentes LLM es un fenomeno identificado en
      la literatura como "temporal blindness": desalineacion entre decisiones del
      agente y la percepcion humana del tiempo en escenarios multi-turno que evolucionan.

      '
    tipo: claim
    estatus: afirmado
    survived_from: r1
    inferida_por: i1
  - txt: 'El mecanismo de la confabulacion "sesion anterior = ayer" es la deriva de
      anclas temporales: los agentes tratan turnos y sesiones de forma independiente.
      La receta minima correctiva tiene tres componentes: memoria temporal persistente
      indexada por tiempo, modulo de seguimiento de linea temporal entre interacciones,
      y mecanismo de verificacion de consistencia contra restricciones temporales
      almacenadas.

      '
    tipo: claim
    estatus: afirmado
    survived_from: r2
    inferida_por: i1
  - txt: 'Existen dos marcos temporales de referencia (t-FoR): deictico (pasado-presente-futuro,
      requiere un "ahora" anclado) y secuencial (antes-despues, requiere solo orden
      relativo). El cabezal de sesion debe alimentar ambos: ts_now para el deictico
      y delta calculado de ultima sesion para el secuencial.

      '
    tipo: claim
    estatus: afirmado
    survived_from: r3
    inferida_por: i1
  - txt: 'El estandar de facto 2025-2026 para persistencia temporal en memoria de
      agentes es el modelo bi-temporal: linea del mundo (t_valid, t_invalid) mas linea
      transaccional (t_created, t_expired), con invalidacion no destructiva de hechos
      superados. Formaliza la regla epistemologica 4 del ecosistema (liveness != veracidad).

      '
    tipo: claim
    estatus: afirmado
    survived_from: r4
    inferida_por: i1
  - txt: 'En sistemas de procesos paralelos sin reloj global, el acuerdo sobre el
      orden causal de eventos importa mas que el tiempo fisico (Lamport 1978). Los
      vector clocks distinguen causalidad de concurrencia entre agentes.

      '
    tipo: claim
    estatus: afirmado
    survived_from: r5
    inferida_por: i1
  - txt: 'El Hybrid Logical Clock (timestamp fisico + contador logico) es el punto
      medio pragmatico adoptado por sistemas distribuidos modernos y es la forma recomendada
      para el sello del cabezal de sesion: (ts_ISO_offset, seq_agente).

      '
    tipo: decision
    estatus: afirmado
    survived_from: r6
    inferida_por: i1
