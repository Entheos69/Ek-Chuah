  inscripciones:
  - local_id: i1
    premisa: 'El DICTAMEN F1 INDUPOX (pre-laboratorio, 2026-07-16) declaro como requisito
      previo a F0 que "el referente Evonik" del Endurecedor 2353 de CMP no tiene nombre
      de producto ni ID de TDS en ningun canonico (obs. editorial §5.3). Sin ese documento,
      los criterios F0-a/b/d quedan sin numeros ancla y la equivalencia CMP-vs-Evonik
      no es adjudicable. El candidato natural por nomenclatura es Ancamide 2353 de
      Evonik.

      '
    busqueda:
    - Ancamide 2353 Evonik technical data sheet AHEW
    resultados_crudos:
    - fuente: products.evonik.com (TDS oficial Ancamide 2353, PDF)
      texto: Equivalent Wt/{H} 114
    - fuente: specialchem.com (ficha Ancamide 2353, adhesivos)
      texto: recommended usage level at EEW=190 is 60 phr
    conclusion: 'LECTURA (interpretacion fechada, no dato): (1) El referente existe
      y es Ancamide 2353 de Evonik, poliamida modificada de alto desempeno; el TDS
      oficial esta publicado en products.evonik.com (asset PV 52041310, pie de pagina
      fechado 2026-03-26). (2) El AHEW del referente es 114, NO 120 como asume el
      supuesto raiz S2 del dictamen: la dosis recomendada 60 phr a EEW=190 es consistente
      (0.60x190=114). A formato 1:1 vol de V-11, r pasa de 1.014 a ~1.07 (+6.7% exceso
      amina) - sigue dentro de latitud; la conclusion de robustez del dictamen se
      sostiene, pero S2 debe corregirse a 114 si F0 corrobora la equivalencia. (3)
      El gel time del TDS (150 g, Techne GT-4) es 65 min: el criterio F0-a del presupuesto
      coincide verbatim con el referente - el canonico claramente derivo de este documento.
      (4) Shore D del referente = 80 (ASTM D2240, 60 phr, 7 dias): el umbral F0-b
      >=75 propuesto como [supuesto S8] adquiere fuente (TDS menos 5 pts). (5) El
      TDS identifica "Epodil 748: C12-14 Alkyl Glycidyl Ether" - diluyente REACTIVO
      monofuncional: el supuesto S7 del dictamen se inclina fuertemente al caso reactivo
      para el Diluyente 748 de CMP (presunto analogo), favoreciendo el ratio 100:21
      en la corrida C1 de P-51. (6) Specific gravity del referente = 1.01 (no 0.98
      como derive del canonico P-51): la auditoria de densidades Q4 del Apendice se
      re-abre - con rho(2353)=1.01 la ficha V-11 (1.04) cuadra y las de F-11/P-51
      quedan bajas; el outlier podria ser el inverso del dictaminado. D1 adjudica.
      (7) Peak exotherm del TDS: 300 F (149 C) en masa de 100 g - corrobora la cota
      adiabatica ~150 C derivada en Q6.2. CAVEAT global: todos estos son valores del
      REFERENTE Ancamide; la equivalencia del 2353 de CMP sigue condicional hasta
      F0.

      '
    inferidor:
      model: fable/claude-fable-5
      ts: '2026-07-16T15:05:00'
  necesidad:
    pregunta: 'Que producto Evonik es el referente del Endurecedor 2353 de CMP, y
      que valores publica su TDS oficial (AHEW, gel time, Shore D, densidad) para
      anclar numericamente los criterios F0-a/b/d del dictamen F1 INDUPOX.

      '
