    conclusion: 'Lectura del 2026-11-17, no hecho. (1) MCU: tres familias automotrices
      de 5 V vigentes. Renesas RL78/F13 (2.7-5.5 V, 20 a 80 pines, ADC de 10 bits
      con 4 a 31 canales) es la unica que cubre con un solo core el rango de pines
      pedido, a precio medio. ST STM8AF (3-5.5 V, compromiso de disponibilidad hasta
      2036) resulto la mas cara por unidad pese a ser de 8 bits. NXP S32K116 (2.7-5.5
      V, 32 y 48 pines, ADC de 12 bits) cuesta casi lo mismo que el STM8AF y es de
      32 bits, con 39 semanas de plazo. Microchip AVR DD automotriz es con mucho la
      mas barata, pero la familia termina en 32 pines (26 E/S): sirve si el presupuesto
      de E/S del modulo izquierdo baja de ~30, lo que depende del trazado. TI MSPM0-Q1
      queda fuera si se elige 5 V: alimenta a 1.62-3.6 V. (2) Regulador: Infineon
      TLS810B1 es el unico de la terna con existencia el dia de la captura; TI TPS7B81-Q1
      y Microchip MCP1799 estaban agotados con 26 y 52 semanas. El MCP1799 es el mas
      barato pero su corriente de reposo (45 uA) es un orden mayor que la de los otros
      dos. (3) En costo, el MCU y el regulador juntos pesan menos que el puente del
      vidrio ya elegido. Precios, existencias y plazos son volatiles (re-verificar
      pasados 45 dias). No se obtuvo la corriente de modo STOP del RL78/F13 ni la
      mencion AEC-Q100 en su hoja; las cifras del TLS810B1 vienen del distribuidor,
      no de la hoja de datos.

      '
