  inscripciones:
  - local_id: i1
    premisa: 'El modulo sustituto de puerta (proyecto modulo_puerta del Taller) llevara
      MCU en ambos modulos, sistema de 12 V. El Guardian establecio: alimentacion
      permanente (los seguros funcionan siempre; lo demas con ignicion), entradas
      de control por resistencia a masa (6.4 kOhm elevador, 315 Ohm seguro), un pin
      por sentido, y el costo como parametro a ponderar, ni solo lo caro ni solo lo
      barato. Se busca una familia de MCU automotriz de 5 V que escale de unos 20
      a 48 pines, con ADC y bajo consumo, y un regulador de baja caida, entrada de
      40 V o mas y corriente de reposo minima.

      '
    busqueda:
    - Renesas RL78/F13 automotive body microcontroller 5V 20 to 48 pin AEC-Q100 datasheet
    - Microchip AVR DD family automotive AEC-Q100 5V 14 to 32 pin AVR32DD28 VAO datasheet
    - STM8AF6266 STM8AF6223 automotive 8-bit MCU 5V AEC-Q100 status active longevity
    - NXP S32K116 automotive MCU 5V 32-pin 48-pin AEC-Q100 price
    - TI MSPM0L1306-Q1 MSPM0G3507-Q1 automotive microcontroller AEC-Q100 supply voltage
      price
    - automotive LDO 40V low quiescent current 5V TPS7B81-Q1 TLS810B1 MCP1799 LDO40L
      comparison
    - Infineon TLS810B1 LDO 5V 45V 5 µA quiescent current automotive datasheet price
      Digi-Key
    - Microchip MCP1799 automotive LDO 45V 80 mA AEC-Q100 5V price Digi-Key MCP1799T-5002H
    - STM8AF6266TCY Digi-Key price stock
    - R5F10BGCLFB RL78/F13 48-LQFP Digi-Key price stock
    - TPS7B8150QDGNRQ1 Digi-Key price stock
    - AVR64DD32 automotive VAO AEC-Q100 Digi-Key AVR64DD32T-E/PT price
