    conclusion: 'La fuga alcanzo VALORES DESCIFRADOS de un subconjunto de env vars
      (no solo cifrado en reposo), via credenciales comprometidas; techo <=1.85% de
      workspaces (~100k), no conteo confirmado. Railway invalido sus API tokens, regenero
      credenciales de bucket y coordino revocacion con proveedores (incl. Anthropic)
      -- lo que explica por que la ANTHROPIC_API_KEY de INDUCOP llego muerta. Remediacion
      de consenso: rotar TODO secreto almacenado en Railway (no solo victimas). Sobre
      cambiar de prestador: el incidente por si solo NO es razon decisiva (toda PaaS
      con secretos tiene la clase de riesgo; Railway respondio razonablemente); la
      palanca de mayor valor es reducir el blast-radius de los secretos (secrets-manager
      externo / BYOC) en cualquier PaaS. NOTA: la dimension de prestadores se apoya
      en comparativas secundarias leidas a nivel busqueda, menos rigurosa que los
      hechos del incidente; se deja como lectura, no como afirmacion anclada. Las
      citas llegaron via WebFetch: el content_hash de la materializacion local es
      la captura autoritativa.

      '
