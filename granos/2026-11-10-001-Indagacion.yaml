ek_chuah_aec:
  meta:
    schema_version: aec-1
    session_id: 2026-11-10-001-Indagacion
    consolidado_por: Guardian
    project: ek-chuah
  inscripciones:
  - local_id: i1
    premisa: 'La linea de hardware necesita diagramas electricos de control industrial
      (fuerza y escalera, simbologia NEMA) generados desde una descripcion en datos,
      no dibujados a mano. Un primer generador propio (matplotlib) dibujaba geometria
      sin semantica electrica. Hueco: que herramienta de terceros, con formato abierto,
      permite generar el diagrama por script y conservar la conectividad, para no
      reinventar la rueda.

      '
    busqueda:
    - QElectroTech elements collection NEMA ANSI symbols .qet XML format
    - Python generate KiCad schematic programmatically kicad-sch-api kiutils SKiDL
      2026
    resultados_crudos:
    - fuente: github.com/qelectrotech/qelectrotech-source-mirror/wiki/faq
      texto: are XML, so text editors can view/edit them
    - fuente: github.com/qelectrotech/qelectrotech-source-mirror/wiki/cli_reference
      texto: CSV electrical nets
    - fuente: github.com/qelectrotech/qelectrotech-source-mirror/wiki/downloads
      texto: for the 0.200.1 nightly
    - fuente: github.com/qelectrotech/qelectrotech-source-mirror/wiki/mcp_server
      texto: standard library only, no MCP SDK dependency
    - fuente: github.com/qelectrotech/qelectrotech-elements (arbol 10_electric)
      texto: 90_american_standards
    - fuente: pypi.org/pypi/skidl/json (ficha de SKiDL 3.0.0)
      texto: Generate netlists, XML BOMs, DOT graphs, or a placed-and-routed schematic
    - fuente: kicad-sch-api.readthedocs.io/en/latest (doc 0.2.4)
      texto: Electrical Rules Check (ERC) User Guide
    conclusion: 'LECTURA. Para control industrial, QElectroTech (QET) es destino viable
      de diagramas generados desde datos: su formato es XML y los simbolos viajan
      dentro del proyecto. No trae simbologia NEMA util (hay que crearla). La automatizacion
      sin ventana (exportar PDF, redes, materiales; scripting; servidor MCP) esta
      documentada para la rama de desarrollo 0.200.1, no para la estable. Para electronica
      (tarjetas), el ecosistema KiCad en Python (SKiDL, kicad-sch-api) cubre generacion
      y verificacion. MEDIDO POR EJECUCION, no por lectura (no sale de las fuentes
      citadas): la coleccion oficial clonada en el commit 7832b79 (2026-11-07) tiene
      9026 .elmt y el directorio 90_american_standards contiene 4; un .qet generado
      por script abrio en QET 0.9 (Ubuntu 24.04) y en 0.100.0 (Windows, verificado
      por el Guardian) y conservo 40 redes, 9 enlaces y 34 rotulos tras abrir y volver
      a guardar en 0.9; QET 0.9 no ofrece opciones de exportacion en su --help; la
      rama master (commit 76b482d) no compilo con Qt 6.4. INFERIDO, no verificado:
      que la exportacion por linea de comandos exista solo en 0.200.1 (se deduce de
      la doc y de su ausencia en 0.9; en 0.100.0 no se probo). LIMITES DE PROCEDENCIA.
      (1) r2 a r5 no fueron devueltas por el buscador: se alcanzaron navegando desde
      los resultados de la consulta 1 (clon git de la wiki y del repositorio de simbolos)
      y se re-capturaron por HTTP. (2) Las paginas de la wiki de GitHub mutan: el
      FAQ que devolvio el buscador decia que los proyectos son .qet; la pagina viva
      ya dice .qetz por defecto. Ventana de link-rot aceptada. (3) r6 se cita por
      la API JSON de PyPI porque la pagina HTML del proyecto responde con un reto
      de JavaScript a un cliente sin navegador. (4) De r7 solo se capturo el indice
      de navegacion; el cuerpo de la pagina no se leyo completo.

      '
    inferidor:
      model: estratega/claude-fable-5-2
      ts: '2026-11-10T19:57:56-06:00'
