    conclusion: 'Lectura del 2026-11-18, no hecho. La ficha de Digi-Key del STM8AF6266TCY
      sostiene los datos tecnicos y la calificacion AEC-Q100, pero no la revision
      de la norma ni el compromiso de disponibilidad hasta 2036, que solo se leyeron
      en st.com el dia 17: ambos quedan fuera del AEC. La ficha de Digi-Key del FS32K116LAT0MFMT
      da precio, existencia y plazo de hoy, distintos de los de Farnell del dia 17
      (4.88 EUR, 1,271 piezas), y no lista calificacion: la mencion AEC-Q100 del S32K116
      queda fuera tambien. Una ficha de distribuidor es una lectura fechada y volatil,
      no una especificacion; se acepta como ancla porque baja de forma reproducible.
      Re-verificar pasados 45 dias.

